<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Soccerwarz</title>
  <!-- 2026-11-12 링크로 게임 열기(/app/<키>) — 게임이 깔려 있으면 OS 가 이 페이지 대신 게임을 엶(App Links · universal link,
       /.well-known/assetlinks.json · apple-app-site-association). 여기까지 왔으면 게임이 없는 것 → /get/ 으로(src 그대로, 없으면 applink) -->
  <script>
    var q = new URLSearchParams(location.search);
    if (!q.get("src")) q.set("src", "applink");
    location.replace("/get/?" + q.toString());
  </script>
  <meta http-equiv="refresh" content="1;url=/get/?src=applink">
</head>
<body></body>
</html>
