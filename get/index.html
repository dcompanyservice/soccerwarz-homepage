<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soccerwarz - Get the game</title>
  <meta name="description" content="Soccerwarz, a 7v7 soccer strategy game. Launching November 18, 2026 on Android and iOS.">
  <meta name="robots" content="noindex">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Soccerwarz">
  <meta property="og:title" content="Soccerwarz - Get the game">
  <meta property="og:description" content="7v7 soccer strategy. Predict your opponent&#39;s strategy and place your players. Android &amp; iOS, November 18, 2026.">
  <meta property="og:image" content="https://soccer-warz.com/images/og.jpg">
  <meta property="og:url" content="https://soccer-warz.com/get/">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/style.css?v=20261102">
  <style>
    .get-wrap { box-sizing: border-box; width: 100%; max-width: 560px; margin: 0 auto; padding: 48px 20px 64px; text-align: center; }
    .get-wrap * { box-sizing: border-box; }
    .get-wrap img.icon { display: block; margin: 0 auto; width: 112px; height: 112px; border-radius: 24px; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
    .get-wrap h1 { font-size: 34px; margin: 18px 0 6px; }
    .get-wrap .lead { opacity: .85; margin: 0 0 22px; }
    .get-wrap .date { display: inline-block; padding: 6px 14px; border-radius: 999px; background: rgba(255,215,0,.15); color: #ffd84a; font-weight: 700; margin-bottom: 22px; }
    .get-btns { display: flex; flex-direction: column; gap: 12px; margin: 0 auto 18px; width: 100%; max-width: 360px; }
    .get-btns a { display: block; padding: 14px 18px; border-radius: 14px; font-weight: 700; text-decoration: none; background: #23324a; color: #fff; }
    .get-btns a.primary { background: #3f9c5a; }
    .get-note { font-size: 14px; opacity: .7; }
  </style>
</head>
<body>
  <main class="get-wrap">
    <img class="icon" src="/assets/app_icon.png" alt="Soccerwarz">
    <h1>Soccerwarz</h1>
    <p class="lead" id="lead"></p>
    <div class="date" id="date"></div>
    <div class="get-btns" id="btns"></div>
    <p class="get-note" id="note"></p>
  </main>
  <script>
  /* 한 링크 페이지(2026-11-03 사용자 · x 세션 요청) — soccer-warz.com/get?src=<출처>
     · 11/18 10:30(한국 시각) 전: "출시 예정" + 공식 사이트·Discord·네이버 라운지(한국어) 링크
     · 11/18 뒤: 아이폰·아이패드 → App Store(ct=<src>), 안드로이드 → Google Play(referrer utm_source=<src>) 로 바로 이동, PC 는 두 버튼
     · 언어 = 브라우저 언어(ko·ja·그 밖 en). 시험: ?live=1 이면 출시 뒤 화면, ?live=0 이면 출시 전 화면(이동 안 함) */
  (function () {
    var LAUNCH_MS = Date.UTC(2026, 10, 18, 1, 30, 0);   // 2026-11-18 10:30 KST(10:00 애플 출시·Play 게시 → 10:30 스토어 열림 확인 뒤 — x 세션 11/3). 늦추려면 이 줄만 바꿔 푸시
    var IOS_ID = "6826829546", PKG = "com.dcompany.soccerwarz";
    var DISCORD = "https://discord.gg/YrR8NMAfMd", LOUNGE = "https://game.naver.com/lounge/Soccerwarz/home";
    var q = new URLSearchParams(location.search);
    var src = (q.get("src") || "").toLowerCase().replace(/[^a-z0-9_\-]/g, "").slice(0, 40) || "direct";
    var forced = q.get("live");
    var live = forced === "1" ? true : forced === "0" ? false : Date.now() >= LAUNCH_MS;
    var nl = (navigator.language || "en").toLowerCase();
    var lang = nl.indexOf("ko") === 0 ? "ko" : nl.indexOf("ja") === 0 ? "ja" : "en";
    document.documentElement.lang = lang;
    var T = {
      ko: { lead: "7대7 축구 전략 게임 — 상대 전략을 예측하고 선수를 배치해 승부하세요", soon: "2026년 11월 18일 출시 예정", now: "지금 출시!", site: "공식 사이트", discord: "Discord", lounge: "네이버 게임 라운지", ios: "App Store 에서 받기", play: "Google Play 에서 받기", going: "스토어로 이동하는 중…", noteSoon: "출시일에 이 링크에서 바로 받을 수 있어요." },
      ja: { lead: "7対7のサッカー戦略ゲーム — 相手の戦略を読んで選手を配置し、勝負しよう", soon: "2026年11月18日 配信予定", now: "配信開始！", site: "公式サイト", discord: "Discord", lounge: "", ios: "App Store でダウンロード", play: "Google Play で手に入れよう", going: "ストアに移動しています…", noteSoon: "配信日にこのリンクからすぐダウンロードできます。" },
      en: { lead: "7v7 soccer strategy — predict your rival and place your players to win", soon: "Launching November 18, 2026", now: "Out now!", site: "Official website", discord: "Discord", lounge: "", ios: "Download on the App Store", play: "Get it on Google Play", going: "Taking you to the store…", noteSoon: "On launch day, this link takes you straight to the store." }
    }[lang];
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);
    var IOS_URL = "https://apps.apple.com/app/id" + IOS_ID + "?ct=" + encodeURIComponent(src) + "&mt=8";
    var PLAY_URL = "https://play.google.com/store/apps/details?id=" + PKG + "&referrer=" + encodeURIComponent("utm_source=" + src + "&utm_medium=get");
    var $ = function (id) { return document.getElementById(id); };
    $("lead").textContent = T.lead;
    var btn = function (href, text, primary) {
      var a = document.createElement("a"); a.href = href; a.textContent = text; if (primary) a.className = "primary"; a.rel = "noopener"; $("btns").appendChild(a);
    };
    try { if (navigator.sendBeacon) navigator.sendBeacon("https://api.soccer-warz.com/pv?p=" + encodeURIComponent("/" + lang + "/get/" + (live ? "live" : "soon")) + "&src=" + encodeURIComponent(src)); } catch (e) {}
    if (!live) {
      $("date").textContent = T.soon;
      btn("/" + lang + "/", T.site, true);
      btn(DISCORD, T.discord);
      if (lang === "ko") btn(LOUNGE, T.lounge);
      $("note").textContent = T.noteSoon;
      return;
    }
    $("date").textContent = T.now;
    if (isIOS) { btn(IOS_URL, T.ios, true); $("note").textContent = T.going; location.replace(IOS_URL); return; }
    // 안드로이드: Play 스토어 앱을 바로 엶(intent — 크롬 안 웹 페이지로 열리던 것, A24 2026-11-03), 스토어 앱이 없으면 웹 주소로
    var PLAY_INTENT = "intent://details?id=" + PKG + "&referrer=" + encodeURIComponent("utm_source=" + src + "&utm_medium=get") +
      "#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=" + encodeURIComponent(PLAY_URL) + ";end";
    if (isAndroid) { btn(PLAY_INTENT, T.play, true); $("note").textContent = T.going; location.replace(PLAY_INTENT); return; }
    btn(IOS_URL, T.ios, true);
    btn(PLAY_URL, T.play, true);
    btn("/" + lang + "/", T.site);
  })();
  </script>
</body>
</html>
