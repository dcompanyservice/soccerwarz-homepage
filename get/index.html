<body>

  <script>

       — 단 아이폰·아이패드는 App Store 사전예약으로 바로 이동, PC 는 사전예약 버튼 추가(2026-11-07 iOS 사전예약 공개 · x 세션 요청)
     · 11/18 뒤: 아이폰·아이패드 → App Store(ct=<src>), 안드로이드 → Google Play(referrer utm_source=<src>) 로 바로 이동, PC 는 두 버튼
     · 언어 = 브라우저 언어(ko·ja·그 밖 en). 시험: ?live=1 이면 출시 뒤 화면, ?live=0 이면 출시 전 화면(이동 안 함) */
  (function () {
    var LAUNCH_MS = Date.UTC(2026, 10, 17, 11, 0, 0);   // 2026-11-17 20:00 KST — Play 공개를 앞당김(2026-11-07 x 세션: iOS 사전예약은 나라별 현지 0시라 뉴질랜드가 11/17 20:00 KST 에 제일 먼저 열림 → 안드로이드가 어디서도 늦지 않게). 옛 11-18 10:30. 바꾸려면 이 줄만 고쳐 푸시
    var IOS_ID = "6826829546", PKG = "com.dcompany.soccerwarz";
    var DISCORD = "https://discord.gg/YrR8NMAfMd", LOUNGE = "https://game.naver.com/lounge/Soccerwarz/home";
    var q = new URLSearchParams(location.search);
    var src = (q.get("src") || "").toLowerCase().replace(/[^a-z0-9_\-]/g, "").slice(0, 40) || "direct";
    // 친구 초대(?src=invite&code=<8자리>, 앱 1.1.8~ — 2026-11-15): 안드로이드는 Play 추천인에 invite=<코드> 를 붙여 앱이 자동 입력, 아이폰·PC 는 코드를 보여 주고 손으로 입력
    var code = (q.get("code") || "").replace(/[^0-9]/g, "").slice(0, 8);
    if (code.length !== 8) code = "";
    var REF = "utm_source=" + src + "&utm_medium=get" + (code ? "&invite=" + code : "");
    var forced = q.get("live");
    var live = forced === "1" ? true : forced === "0" ? false : Date.now() >= LAUNCH_MS;
    var ql = (q.get("lang") || "").toLowerCase();   // 화면 언어 미리보기(?lang=ko|ja|en — 2026-11-07 x 세션 요청, 있으면 기기 언어보다 우선)
    // ?lang 이 없으면 src 로 기본 언어(2026-11-07 x 세션 — X @soccerwarzx 는 일본 전용 계정): x_… 또는 …_ja → ja · …_ko → ko · …_en → en, 그 밖엔 기기 언어
    var sl = /^x_|_ja$/.test(src) ? "ja" : /_ko$/.test(src) ? "ko" : /_en$/.test(src) ? "en" : "";
    // 11개 언어(2026-11-15 사용자 "각 나라 언어로 보이게") — 페이지 경로 = 사이트 폴더 이름(ko · ja · en · zh-tw · zh-cn · de · fr · it · es · pt · ru)
    var LANGS = ["ko", "ja", "en", "zh-tw", "zh-cn", "de", "fr", "it", "es", "pt", "ru"];
    var nl = (LANGS.indexOf(ql) >= 0 ? ql : sl || (navigator.language || "en")).toLowerCase().replace("_", "-");
    var lang = nl.indexOf("zh") === 0 ? (/tw|hk|mo|hant/.test(nl) ? "zh-tw" : "zh-cn") : LANGS.indexOf(nl.slice(0, 2)) >= 0 ? nl.slice(0, 2) : "en";
    document.documentElement.lang = lang;
    var T = {
      ko: { code: "초대 코드 {c} — 게임을 받은 뒤 [친구] → [초대]에 넣으면 둘 다 다이아 100개", lead: "7대7 축구 전략 게임 — 상대 전략을 예측하고 선수를 배치해 승부하세요", soon: "2026년 11월 18일 출시 예정", now: "지금 출시!", site: "공식 사이트", discord: "Discord", lounge: "네이버 게임 라운지", ios: "App Store 에서 받기", play: "Google Play 에서 받기", going: "스토어로 이동하는 중…", pre: "App Store 사전예약", noteSoon: "출시일에 이 링크에서 바로 받을 수 있어요." },
      ja: { code: "招待コード {c} — ゲームを入れたら［フレンド］→［招待］に入力すると2人ともダイヤ100個", lead: "7対7のサッカー戦略ゲーム — 相手の戦略を読んで選手を配置し、勝負しよう", soon: "2026年11月18日 配信予定", now: "配信開始！", site: "公式サイト", discord: "Discord", lounge: "", ios: "App Store でダウンロード", play: "Google Play で手に入れよう", going: "ストアに移動しています…", pre: "App Storeで事前予約", noteSoon: "配信日にこのリンクからすぐダウンロードできます。" },
      "zh-tw": { code: "邀請碼 {c} — 安裝遊戲後到［好友］→［邀請］輸入，雙方各得 100 鑽石", lead: "7對7足球策略遊戲 — 預測對手的戰術並部署球員來取勝", soon: "2026年11月18日上市", now: "現已上市！", site: "官方網站", discord: "Discord", lounge: "", ios: "從 App Store 下載", play: "在 Google Play 取得", going: "正在前往商店…", pre: "在 App Store 預訂", noteSoon: "上市當天可從此連結直接下載。" },
      "zh-cn": { code: "邀请码 {c} — 安装游戏后到［好友］→［邀请］输入，双方各得 100 钻石", lead: "7对7足球策略游戏 — 预测对手的战术并部署球员来取胜", soon: "2026年11月18日上线", now: "现已上线！", site: "官方网站", discord: "Discord", lounge: "", ios: "从 App Store 下载", play: "在 Google Play 获取", going: "正在前往商店…", pre: "在 App Store 预订", noteSoon: "上线当天可从此链接直接下载。" },
      de: { code: "Einladungscode {c} — nach der Installation unter [Freunde] → [Einladen] eingeben, dann bekommt ihr beide 100 Diamanten", lead: "7-gegen-7-Fußballstrategie — sag die Taktik deines Gegners voraus und stelle deine Spieler auf", soon: "Erscheint am 18. November 2026", now: "Jetzt erhältlich!", site: "Offizielle Website", discord: "Discord", lounge: "", ios: "Laden im App Store", play: "Jetzt bei Google Play", going: "Weiter zum Store …", pre: "Im App Store vorbestellen", noteSoon: "Am Erscheinungstag führt dich dieser Link direkt zum Store." },
      fr: { code: "Code d'invitation {c} — après l'installation, entre-le dans [Amis] → [Inviter] et vous recevez chacun 100 diamants", lead: "Stratégie de foot en 7 contre 7 — anticipe la tactique adverse et place tes joueurs", soon: "Sortie le 18 novembre 2026", now: "Disponible !", site: "Site officiel", discord: "Discord", lounge: "", ios: "Télécharger dans l'App Store", play: "Disponible sur Google Play", going: "Redirection vers le store…", pre: "Précommander sur l'App Store", noteSoon: "Le jour de la sortie, ce lien mène directement au store." },
      it: { code: "Codice invito {c} — dopo l'installazione inseriscilo in [Amici] → [Invita] e ricevete entrambi 100 diamanti", lead: "Strategia calcistica 7 contro 7 — prevedi la tattica avversaria e schiera i tuoi giocatori", soon: "Esce il 18 novembre 2026", now: "Disponibile ora!", site: "Sito ufficiale", discord: "Discord", lounge: "", ios: "Scarica su App Store", play: "Disponibile su Google Play", going: "Apertura dello store…", pre: "Preordina su App Store", noteSoon: "Il giorno dell'uscita questo link porta direttamente allo store." },
      es: { code: "Código de invitación {c} — tras instalar, ponlo en [Amigos] → [Invitar] y ambos reciben 100 diamantes", lead: "Estrategia de fútbol 7 contra 7 — predice la táctica rival y coloca a tus jugadores", soon: "Sale el 18 de noviembre de 2026", now: "¡Ya disponible!", site: "Sitio oficial", discord: "Discord", lounge: "", ios: "Descargar en App Store", play: "Disponible en Google Play", going: "Abriendo la tienda…", pre: "Reservar en App Store", noteSoon: "El día del lanzamiento, este enlace te lleva directo a la tienda." },
      pt: { code: "Código de convite {c} — depois de instalar, use-o em [Amigos] → [Convidar] e vocês dois ganham 100 diamantes", lead: "Estratégia de futebol 7 contra 7 — preveja a tática do rival e posicione seus jogadores", soon: "Lançamento em 18 de novembro de 2026", now: "Já disponível!", site: "Site oficial", discord: "Discord", lounge: "", ios: "Baixar na App Store", play: "Disponível no Google Play", going: "Abrindo a loja…", pre: "Pré-encomendar na App Store", noteSoon: "No dia do lançamento, este link leva direto à loja." },
      ru: { code: "Код приглашения {c} — после установки введите его в [Друзья] → [Пригласить], и вы оба получите 100 алмазов", lead: "Футбольная стратегия 7 на 7 — предугадай тактику соперника и расставь игроков", soon: "Выход 18 ноября 2026 года", now: "Уже доступно!", site: "Официальный сайт", discord: "Discord", lounge: "", ios: "Загрузить в App Store", play: "Доступно в Google Play", going: "Переходим в магазин…", pre: "Предзаказ в App Store", noteSoon: "В день выхода эта ссылка откроет магазин." },
      en: { code: "Invite code {c} — after installing, enter it in [Friends] → [Invite] and you both get 100 diamonds", lead: "7v7 soccer strategy — predict your rival and place your players to win", soon: "Launching November 18, 2026", now: "Out now!", site: "Official website", discord: "Discord", lounge: "", ios: "Download on the App Store", play: "Get it on Google Play", going: "Taking you to the store…", pre: "Pre-order on the App Store", noteSoon: "On launch day, this link takes you straight to the store." }
    }[lang];
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);
    var IOS_URL = "https://apps.apple.com/app/id" + IOS_ID + "?ct=" + encodeURIComponent(src) + "&mt=8";
    var PLAY_URL = "https://play.google.com/store/apps/details?id=" + PKG + "&referrer=" + encodeURIComponent(REF);
    var $ = function (id) { return document.getElementById(id); };
    $("lead").textContent = T.lead;
    var btn = function (href, text, primary) {
      var a = document.createElement("a"); a.href = href; a.textContent = text; if (primary) a.className = "primary"; a.rel = "noopener"; $("btns").appendChild(a);
    };
    try { if (navigator.sendBeacon) navigator.sendBeacon("https://api.soccer-warz.com/pv?p=" + encodeURIComponent("/" + lang + "/get/" + (live ? "live" : "soon")) + "&src=" + encodeURIComponent(src)); } catch (e) {}
    if (!live) {
      $("date").textContent = T.soon;
      if (isIOS) { btn(IOS_URL, T.pre, true); $("note").textContent = T.going; location.replace(IOS_URL); return; }
      if (!isAndroid) btn(IOS_URL, T.pre, true);
      btn("/" + lang + "/", T.site, true);
      btn(DISCORD, T.discord);
      if (lang === "ko") btn(LOUNGE, T.lounge);
      $("note").textContent = T.noteSoon;
      return;
    }
    $("date").textContent = T.now;
    if (code && !isAndroid) {   // 아이폰·PC: 코드를 크게 보여 주고 바로 이동하지 않음(코드를 봐야 하므로) — 스토어 버튼을 누르면 코드 복사 시도
      $("note").textContent = T.code.replace("{c}", code);
      $("note").style.cssText = "font-size:20px;opacity:1;color:#ffd84a;font-weight:700";
      var cp = function () { try { navigator.clipboard && navigator.clipboard.writeText(code); } catch (e) {} };
      if (isIOS) { btn(IOS_URL, T.ios, true); } else { btn(IOS_URL, T.ios, true); btn(PLAY_URL, T.play, true); }
      Array.prototype.forEach.call($("btns").querySelectorAll("a"), function (a) { a.addEventListener("click", cp); });
      return;
    }
    if (isIOS) { btn(IOS_URL, T.ios, true); $("note").textContent = T.going; location.replace(IOS_URL); return; }
    // 안드로이드: Play 스토어 앱을 바로 엶(intent — 크롬 안 웹 페이지로 열리던 것, A24 2026-11-03), 스토어 앱이 없으면 웹 주소로
    var PLAY_INTENT = "intent://details?id=" + PKG + "&referrer=" + encodeURIComponent(REF) +

    if (isAndroid) { btn(PLAY_INTENT, T.play, true); $("note").textContent = T.going; location.replace(PLAY_INTENT); return; }
    btn(IOS_URL, T.ios, true);
    btn(PLAY_URL, T.play, true);
    btn("/" + lang + "/", T.site);
  })();
  </script>
